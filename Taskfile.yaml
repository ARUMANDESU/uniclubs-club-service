version: "3"

vars:
  DATABASE_DSN: postgresql://postgres:password@172.17.0.1:5432/clubdb?sslmode=disable

tasks:
  run:local:
    aliases:
      - loc
    cmd: go run cmd/main.go --config=./config/local.yaml

  run:dev:
    aliases:
      - dev
    cmd: go run cmd/main.go --config=./config/dev.yaml

  run:enviroment:
    aliases:
      - env
    cmd: go run cmd/main.go

  docker-image:
    aliases:
      - doc-img
    cmd: docker build -t arumandesu/club-service -t arumandesu/club-service:0.0.6 . && docker push arumandesu/club-service -a

  migrate:up:
    cmd: migrate -path ./migrations -database {{.DATABASE_DSN}} up

  migrate:down:
    cmd: migrate -path ./migrations -database {{.DATABASE_DSN}} down