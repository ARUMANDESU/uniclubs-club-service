version: "3"

vars:
  DATABASE_DSN: postgresql://postgres:password@localhost:5432/clubdb

tasks:
  run:local:
    aliases:
      - loc
    cmd: go run cmd/main.go --config=./config/local.yaml

  run:dev:
    aliases:
      - dev
    cmd: go run cmd/main.go --config=./config/dev.yaml

  run:enviroment:
    aliases:
      - env
    cmd: go run cmd/main.go

  docker-image:
    aliases:
      - doc-img
    cmd: docker build -t arumandesu/club-service -t arumandesu/club-service:0.0.6 . && docker push arumandesu/club-service -a

  migrate:up:
    cmd: migrate -path ./migrations -database {{.DATABASE_DSN}}?sslmode=disable up

  migrate:down:
    cmd: migrate -path ./migrations -database {{.DATABASE_DSN}}?sslmode=disable down
  
  test:coverage:
    cmd: go test -coverprofile=./tests/c.out ./... || go tool cover -html="./tests/c.out"

  test:unit:
    cmd: go test -v ./...